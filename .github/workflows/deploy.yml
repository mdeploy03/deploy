name: Deploy (herbruikbaar)

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      worker:
        type: string
        required: true
# Secrets komen via "secrets: inherit": zowel repository- als environment-secrets werken.

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Bij "production" kan GitHub om goedkeuring vragen (Settings → Environments).
    environment:
      name: ${{ inputs.environment }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ inputs.environment == 'production' && secrets.PRODUCTION_D1_DATABASE_ID || secrets.STAGING_D1_DATABASE_ID }}
      BASIC_AUTH_PASSWORD: ${{ inputs.environment == 'production' && secrets.PRODUCTION_BASIC_AUTH_PASSWORD || secrets.STAGING_BASIC_AUTH_PASSWORD }}
      PREFIX: ${{ inputs.environment == 'production' && 'PRODUCTION' || 'STAGING' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Secrets controleren (één regel, geen spaties)
        run: |
          fout=0
          for naam in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_DATABASE_ID BASIC_AUTH_PASSWORD; do
            waarde="${!naam}"
            secret="$naam"
            case "$naam" in D1_DATABASE_ID|BASIC_AUTH_PASSWORD) secret="${PREFIX}_$naam";; esac
            if [ -z "$waarde" ]; then
              echo "::error title=Secret ontbreekt::$secret is leeg of niet ingesteld."; fout=1
            elif [[ "$waarde" =~ [[:space:]] ]]; then
              echo "::error title=Secret ongeldig::$secret bevat een spatie of regeleinde. Plak alleen de waarde zelf, op één regel."; fout=1
            fi
          done
          exit $fout

      - run: npm ci

      - name: Database-id invullen (alleen in deze build, niet in de code)
        run: |
          placeholder="__$(echo '${{ inputs.environment }}' | tr a-z A-Z)_D1_DATABASE_ID__"
          grep -q "$placeholder" wrangler.jsonc
          sed -i "s/$placeholder/$D1_DATABASE_ID/" wrangler.jsonc

      - name: Build
        env:
          CLOUDFLARE_ENV: ${{ inputs.environment }}
        run: npm run build

      - name: Databasemigraties toepassen
        run: bash scripts/ci-run.sh npx wrangler d1 migrations apply DB --remote --env "${{ inputs.environment }}" --config wrangler.jsonc

      - name: Deploy Worker
        run: bash scripts/ci-run.sh npx wrangler deploy

      - name: Tijdelijk wachtwoord instellen
        run: printf '%s' "$BASIC_AUTH_PASSWORD" | npx wrangler secret put BASIC_AUTH_PASSWORD --name "${{ inputs.worker }}"
